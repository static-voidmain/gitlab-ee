# GitLab EE Premium single-host deployment.
# 요구사항: 단일 Host Docker 기반 SCM 운영, 외부 Nginx reverse proxy는 이미 존재.
# 구현상세: GitLab HTTP와 Docs만 127.0.0.1에 바인딩하여 외부 노출은 Nginx가 담당한다.
# 제약사항: SSH 포트는 publish하지 않는다. GitLab EE 본체 platform은 scripts/prepare-platform-env.sh로 host 아키텍처에 맞게 생성한다.
services:
  gitlab:
    image: ${GITLAB_IMAGE:-gitlab/gitlab-ee:19.0.0-ee.0}
    container_name: ${GITLAB_CONTAINER_NAME:-gitlab-ee}
    hostname: ${GITLAB_HOSTNAME:-igit.bluewalnut.co.kr}
    platform: ${GITLAB_PLATFORM:?Run ./scripts/prepare-platform-env.sh vmware-2c6g --force to set GITLAB_PLATFORM for this Docker host}
    restart: unless-stopped
    shm_size: "256m"
    env_file:
      # 구현상세: 운영에서는 .env를 사용하지만, 정적 검증은 .env.example만으로도 가능해야 한다.
      # 테스트 스크립트는 GITLAB_ENV_FILE을 외부 환경 변수로 지정해 로컬 .env 섞임을 막는다.
      - path: ${GITLAB_ENV_FILE:-.env}
        required: false
    environment:
      # 요구사항: GitLab EE 최신 안정 패치 고정, Premium 기능만 사용.
      # 구현상세: 운영 external_url은 외부 Nginx TLS URL, smoke profile은 http://localhost:8080을 사용한다.
      # GitLab 내장 Nginx는 두 경우 모두 HTTP 80으로만 listen한다.
      GITLAB_OMNIBUS_CONFIG: |
        require 'uri'

        gitlab_external_url = ENV.fetch('GITLAB_EXTERNAL_URL', 'https://gitlab.example.co.kr')
        begin
          gitlab_external_uri = URI.parse(gitlab_external_url)
        rescue URI::InvalidURIError => e
          raise "GITLAB_EXTERNAL_URL is invalid: #{e.message}"
        end

        unless %w[http https].include?(gitlab_external_uri.scheme)
          raise 'GITLAB_EXTERNAL_URL must use http or https'
        end
        if gitlab_external_uri.host.to_s.empty?
          raise 'GITLAB_EXTERNAL_URL must include a hostname'
        end

        gitlab_external_scheme = gitlab_external_uri.scheme
        external_url gitlab_external_url

        # 구현상세: 외부 Nginx가 TLS 종료를 담당하므로 컨테이너 내부는 HTTP 80만 사용한다.
        nginx['listen_port'] = 80
        nginx['listen_https'] = false
        nginx['redirect_http_to_https'] = false
        letsencrypt['enable'] = false

        # 제약사항: Git SSH 서비스는 회사 정책상 미제공. 호스트 publish도 하지 않는다.
        gitlab_rails['gitlab_shell_ssh_port'] = 22

        # 구현상세: reverse proxy 원 IP 보존. TRUSTED_PROXY_CIDRS는 사내 Nginx/로드밸런서 CIDR만 지정한다.
        gitlab_rails['trusted_proxies'] = ENV.fetch('TRUSTED_PROXY_CIDRS', '127.0.0.1/32').split(',').map(&:strip)
        nginx['real_ip_trusted_addresses'] = ENV.fetch('TRUSTED_PROXY_CIDRS', '127.0.0.1/32').split(',').map(&:strip)
        nginx['real_ip_header'] = 'X-Forwarded-For'
        nginx['real_ip_recursive'] = 'on'
        gitlab_proxy_set_headers = {
          'Host' => '$$http_host',
          'X-Real-IP' => '$$remote_addr',
          'X-Forwarded-For' => '$$proxy_add_x_forwarded_for',
          'X-Forwarded-Proto' => gitlab_external_scheme
        }
        gitlab_proxy_set_headers['X-Forwarded-Ssl'] = 'on' if gitlab_external_scheme == 'https'
        nginx['proxy_set_headers'] = gitlab_proxy_set_headers

        # 보안: Git/Registry 인증 실패는 access log의 401 추정이 아니라 GitLab 내장 Rack Attack으로 차단한다.
        # 구현상세: 정상 Git HTTP 요청도 최초 401을 발생시키므로 외부 Fail2Ban 401 규칙은 사용하지 않는다.
        gitlab_positive_integer = lambda do |name, default|
          value = Integer(ENV.fetch(name, default), 10)
          raise "#{name} must be greater than zero" unless value.positive?
          value
        end
        gitlab_non_negative_integer = lambda do |name, default|
          value = Integer(ENV.fetch(name, default), 10)
          raise "#{name} must be zero or greater" if value.negative?
          value
        end
        gitlab_boolean = lambda do |name, default|
          case ENV.fetch(name, default).to_s.strip.downcase
          when 'true', '1', 'yes', 'y'
            true
          when 'false', '0', 'no', 'n'
            false
          else
            raise "#{name} must be true or false"
          end
        end

        gitlab_resource_profile = ENV.fetch('GITLAB_RESOURCE_PROFILE', 'default').to_s.strip.downcase
        supported_resource_profiles = %w[default vmware_2c_6g memory_constrained custom]
        unless supported_resource_profiles.include?(gitlab_resource_profile)
          raise "GITLAB_RESOURCE_PROFILE must be one of: #{supported_resource_profiles.join(', ')}"
        end
        gitlab_memory_tuning_enabled = gitlab_resource_profile != 'default'

        gitlab_rails['rack_attack_git_basic_auth'] = {
          'enabled' => gitlab_boolean.call('GIT_BASIC_AUTH_BAN_ENABLED', 'true'),
          'ip_whitelist' => ENV.fetch('GIT_BASIC_AUTH_BAN_IP_WHITELIST', '127.0.0.1').split(',').map(&:strip),
          'maxretry' => gitlab_positive_integer.call('GIT_BASIC_AUTH_BAN_MAX_RETRY', '5'),
          'findtime' => gitlab_positive_integer.call('GIT_BASIC_AUTH_BAN_FIND_TIME_SECONDS', '60'),
          'bantime' => gitlab_positive_integer.call('GIT_BASIC_AUTH_BAN_TIME_SECONDS', '3600')
        }

        # 운영: Asia/Seoul 기준 로그/감사 추적과 백업 보존 기간을 명시한다.
        gitlab_rails['time_zone'] = ENV.fetch('GITLAB_TIMEZONE', 'Asia/Seoul')
        gitlab_rails['backup_path'] = '/var/opt/gitlab/backups'
        gitlab_rails['backup_keep_time'] = ENV.fetch('GITLAB_BACKUP_KEEP_SECONDS', '1209600').to_i

        if gitlab_memory_tuning_enabled
          # 성능: Ruby 메모리 사용량을 낮추기 위해 Puma/Sidekiq 병렬도를 명시적으로 제한한다.
          # 운영 기본 프로파일에서는 GitLab Omnibus 기본값을 유지한다.
          default_puma_workers = gitlab_resource_profile == 'vmware_2c_6g' ? '1' : '2'
          default_puma_worker_memory = gitlab_resource_profile == 'vmware_2c_6g' ? '1400' : '1200'
          default_sidekiq_concurrency = gitlab_resource_profile == 'vmware_2c_6g' ? '5' : '10'
          puma['worker_processes'] = gitlab_non_negative_integer.call('GITLAB_PUMA_WORKER_PROCESSES', default_puma_workers)
          puma['min_threads'] = gitlab_positive_integer.call('GITLAB_PUMA_MIN_THREADS', '4')
          puma['max_threads'] = gitlab_positive_integer.call('GITLAB_PUMA_MAX_THREADS', '4')
          raise 'GITLAB_PUMA_MIN_THREADS must be less than or equal to GITLAB_PUMA_MAX_THREADS' if puma['min_threads'] > puma['max_threads']
          puma['per_worker_max_memory_mb'] = gitlab_positive_integer.call('GITLAB_PUMA_PER_WORKER_MAX_MEMORY_MB', default_puma_worker_memory)
          sidekiq['concurrency'] = gitlab_positive_integer.call('GITLAB_SIDEKIQ_CONCURRENCY', default_sidekiq_concurrency)

          # 성능: jemalloc이 해제된 페이지를 오래 붙잡지 않게 하여 Ruby RSS 증가를 완화한다.
          default_gitaly_spawn_parallel = gitlab_resource_profile == 'vmware_2c_6g' ? '1' : '2'
          gitlab_allocator_env = {
            'MALLOC_CONF' => ENV.fetch('GITLAB_MALLOC_CONF', 'dirty_decay_ms:1000,muzzy_decay_ms:1000')
          }
          gitlab_rails['env'] = gitlab_allocator_env
          gitaly['env'] = gitlab_allocator_env.merge({
            'GITALY_COMMAND_SPAWN_MAX_PARALLEL' => ENV.fetch('GITALY_COMMAND_SPAWN_MAX_PARALLEL', default_gitaly_spawn_parallel)
          })

          # 성능: Git HTTP clone/fetch가 큰 repository에서 Gitaly를 과점하지 않도록 repository 단위 병렬도를 제한한다.
          if gitlab_boolean.call('GITALY_CONCURRENCY_LIMITS_ENABLED', 'true')
            upload_pack_default = gitlab_resource_profile == 'vmware_2c_6g' ? '3' : '6'
            receive_pack_default = gitlab_resource_profile == 'vmware_2c_6g' ? '2' : '3'
            queue_size_default = gitlab_resource_profile == 'vmware_2c_6g' ? '5' : '10'
            gitaly['configuration'] = {
              concurrency: [
                {
                  rpc: '/gitaly.SmartHTTPService/PostUploadPackWithSidechannel',
                  max_per_repo: gitlab_positive_integer.call('GITALY_SMARTHTTP_UPLOAD_PACK_MAX_PER_REPO', upload_pack_default),
                  max_queue_wait: ENV.fetch('GITALY_SMARTHTTP_UPLOAD_PACK_MAX_QUEUE_WAIT', '1s'),
                  max_queue_size: gitlab_positive_integer.call('GITALY_SMARTHTTP_UPLOAD_PACK_MAX_QUEUE_SIZE', queue_size_default)
                },
                {
                  rpc: '/gitaly.SmartHTTPService/PostReceivePack',
                  max_per_repo: gitlab_positive_integer.call('GITALY_SMARTHTTP_RECEIVE_PACK_MAX_PER_REPO', receive_pack_default),
                  max_queue_wait: ENV.fetch('GITALY_SMARTHTTP_RECEIVE_PACK_MAX_QUEUE_WAIT', '1s'),
                  max_queue_size: gitlab_positive_integer.call('GITALY_SMARTHTTP_RECEIVE_PACK_MAX_QUEUE_SIZE', queue_size_default)
                }
              ]
            }
          end
        end

        # 운영: GitLab 내장 컨테이너 registry는 현재 Harbor 전환 예정이므로 기본 비활성화한다.
        registry['enable'] = false

        # 기능: GitLab Relay(KAS)는 Kubernetes Agent/Runner Controller 사용 시 .env에서 켠다.
        # 구현상세: 외부 Nginx reverse proxy는 WebSocket Upgrade 헤더를 전달해야 한다.
        if gitlab_memory_tuning_enabled || ENV.key?('GITLAB_KAS_ENABLE')
          gitlab_kas['enable'] = gitlab_boolean.call('GITLAB_KAS_ENABLE', 'false')
        end

        # 운영: SMTP는 사내 릴레이가 있을 때만 활성화한다. 비밀값은 .env로만 주입한다.
        gitlab_rails['smtp_enable'] = gitlab_boolean.call('SMTP_ENABLE', 'false')
        if gitlab_rails['smtp_enable']
          gitlab_rails['smtp_address'] = ENV.fetch('SMTP_ADDRESS')
          gitlab_rails['smtp_port'] = ENV.fetch('SMTP_PORT', '587').to_i
          gitlab_rails['smtp_user_name'] = ENV['SMTP_USER_NAME']
          gitlab_rails['smtp_password'] = ENV['SMTP_PASSWORD']
          gitlab_rails['smtp_domain'] = ENV.fetch('SMTP_DOMAIN', ENV.fetch('GITLAB_HOSTNAME', 'gitlab.example.co.kr'))
          gitlab_rails['smtp_authentication'] = ENV.fetch('SMTP_AUTHENTICATION', 'login')
          gitlab_rails['smtp_enable_starttls_auto'] = gitlab_boolean.call('SMTP_ENABLE_STARTTLS_AUTO', 'true')
          gitlab_rails['gitlab_email_from'] = ENV.fetch('GITLAB_EMAIL_FROM')
          gitlab_rails['gitlab_email_reply_to'] = ENV.fetch('GITLAB_EMAIL_REPLY_TO', ENV.fetch('GITLAB_EMAIL_FROM'))
        end

        # 성능: 외부 관측성 스택을 쓰는 단일 호스트에서는 내장 Prometheus/exporter를 꺼서 메모리를 절감한다.
        # 운영 기본 프로파일에서는 GitLab Omnibus 기본값을 유지한다.
        bundled_monitoring_enabled = if ENV.key?('GITLAB_BUNDLED_MONITORING_ENABLE')
          gitlab_boolean.call('GITLAB_BUNDLED_MONITORING_ENABLE', 'false')
        else
          !gitlab_boolean.call('GITLAB_DISABLE_BUNDLED_MONITORING', gitlab_memory_tuning_enabled ? 'true' : 'false')
        end

        if gitlab_memory_tuning_enabled || ENV.key?('GITLAB_BUNDLED_MONITORING_ENABLE') || ENV.key?('GITLAB_DISABLE_BUNDLED_MONITORING')
          if bundled_monitoring_enabled
            alertmanager['enable'] = true
            gitlab_exporter['enable'] = true
            node_exporter['enable'] = true
            postgres_exporter['enable'] = true
            prometheus['enable'] = true
            prometheus_monitoring['enable'] = true
            puma['exporter_enabled'] = gitlab_boolean.call('GITLAB_PUMA_EXPORTER_ENABLE', 'false')
            redis_exporter['enable'] = true
            sidekiq['metrics_enabled'] = gitlab_boolean.call('GITLAB_SIDEKIQ_METRICS_ENABLE', 'true')
          else
            alertmanager['enable'] = false
            gitlab_exporter['enable'] = false
            node_exporter['enable'] = false
            postgres_exporter['enable'] = false
            prometheus['enable'] = false
            prometheus_monitoring['enable'] = false
            puma['exporter_enabled'] = false
            redis_exporter['enable'] = false
            sidekiq['metrics_enabled'] = false
          end
        end

        # 관측성: 컨테이너 로그는 Docker logging driver로 수집하고 GitLab JSON 로그는 /var/log/gitlab에 보존한다.
        logging['svlogd_size'] = ENV.fetch('GITLAB_LOG_ROTATE_SIZE', '200000000').to_i
        logging['svlogd_num'] = ENV.fetch('GITLAB_LOG_ROTATE_NUM', '30').to_i
    ports:
      # 구현상세: 외부 Nginx만 접근해야 하므로 loopback에만 노출한다.
      - "${GITLAB_HTTP_BIND:-127.0.0.1}:${GITLAB_HTTP_PORT:-8080}:80"
    volumes:
      # 운영: Disk 증설/백업/장애복구 편의를 위해 config, logs, data, backups를 명확히 분리한다.
      - ${GITLAB_HOME:-/srv/gitlab-ee}/config:/etc/gitlab
      - ${GITLAB_HOME:-/srv/gitlab-ee}/logs:/var/log/gitlab
      - ${GITLAB_HOME:-/srv/gitlab-ee}/data:/var/opt/gitlab
      - ${GITLAB_HOME:-/srv/gitlab-ee}/backups:/var/opt/gitlab/backups
      - ./scripts/gitlab-rails:/opt/gitlab-bootstrap:ro
      - ./config/password-expiration-exceptions.yml:/opt/gitlab-config/password-expiration-exceptions.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1/-/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"

  gitlab-docs:
    image: ${GITLAB_DOCS_IMAGE:-registry.gitlab.com/gitlab-org/technical-writing/docs-gitlab-com/archives:19.0}
    container_name: ${GITLAB_DOCS_CONTAINER_NAME:-gitlab-docs}
    hostname: ${GITLAB_DOCS_HOSTNAME:-gitlab-docs.example.co.kr}
    platform: ${GITLAB_DOCS_PLATFORM:-linux/amd64}
    restart: unless-stopped
    ports:
      # 구현상세: GitLab /help 리다이렉트 대상. 외부 공개는 사내 Nginx에서 TLS로 처리한다.
      - "${GITLAB_DOCS_BIND:-127.0.0.1}:${GITLAB_DOCS_PORT:-4000}:4000"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  gitlab-runner-docker:
    image: ${GITLAB_RUNNER_IMAGE:-gitlab/gitlab-runner:alpine-v19.0.0}
    container_name: ${GITLAB_RUNNER_DOCKER_CONTAINER_NAME:-gitlab-runner-docker}
    platform: ${GITLAB_RUNNER_PLATFORM:-linux/amd64}
    restart: unless-stopped
    depends_on:
      gitlab:
        condition: service_healthy
    volumes:
      # 구현상세: Docker executor 사용. Docker socket은 강한 권한이므로 protected runner와 allowed_images로 통제한다.
      - ${RUNNER_DOCKER_CONFIG_HOME:-./runtime/gitlab-runner/docker}:/etc/gitlab-runner
      - ${RUNNER_CACHE_HOME:-./runtime/gitlab-runner/cache}:/cache
      - /var/run/docker.sock:/var/run/docker.sock
      - ./runner/templates:/runner-templates:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "gitlab-runner --version >/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  gitlab-runner-shell:
    image: ${GITLAB_SHELL_RUNNER_IMAGE:-bwc/gitlab-runner-shell:19.0.0}
    container_name: ${GITLAB_RUNNER_SHELL_CONTAINER_NAME:-gitlab-runner-shell}
    platform: ${GITLAB_SHELL_RUNNER_PLATFORM:-linux/amd64}
    restart: unless-stopped
    depends_on:
      gitlab:
        condition: service_healthy
    volumes:
      # 구현상세: CodeRay 6.0 RG CLI 등 사내 도구는 read-only mount로 제한한다.
      # 제약사항: shell executor job은 이 컨테이너에서 직접 실행되므로 전용 이미지에 bash/curl/git/jq를 포함한다.
      - ${RUNNER_SHELL_CONFIG_HOME:-./runtime/gitlab-runner/shell}:/etc/gitlab-runner
      - ${RUNNER_SHELL_BUILDS_HOME:-./runtime/gitlab-runner/shell-builds}:/builds
      - ${RUNNER_CACHE_HOME:-./runtime/gitlab-runner/cache}:/cache
      - ${CODERAY_CLI_DIR:-./vendor/coderay}:/opt/coderay:ro
      - ./runner/templates:/runner-templates:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "gitlab-runner --version >/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

# 외부 Nginx reverse proxy 예시.
# 요구사항: GitLab 컨테이너는 loopback HTTP만 노출하고 TLS/HSTS/로그는 Nginx에서 강제한다.

upstream gitlab_ee_http {
    server 127.0.0.1:8080 fail_timeout=0;
}

upstream gitlab_docs_http {
    server 127.0.0.1:4000 fail_timeout=0;
}

map $http_upgrade $gitlab_connection_upgrade {
    default upgrade;
    '' close;
}

log_format gitlab_secure '$remote_addr - $remote_user [$time_local] "$request" '
                         '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                         'xff="$http_x_forwarded_for" request_time="$request_time"';

server {
    listen 443 ssl http2;
    server_name gitlab.example.co.kr;

    server_tokens off;
    client_max_body_size 512m;

    ssl_certificate /etc/nginx/tls/gitlab.example.co.kr/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/gitlab.example.co.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:GitLabTLS:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/gitlab_access.log gitlab_secure;
    error_log /var/log/nginx/gitlab_error.log warn;

    location / {
        proxy_read_timeout 3600;
        proxy_connect_timeout 300;
        proxy_redirect off;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Ssl on;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $gitlab_connection_upgrade;

        proxy_pass http://gitlab_ee_http;
    }
}

server {
    listen 443 ssl http2;
    server_name gitlab-docs.example.co.kr;

    server_tokens off;
    client_max_body_size 32m;

    ssl_certificate /etc/nginx/tls/gitlab-docs.example.co.kr/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/gitlab-docs.example.co.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    access_log /var/log/nginx/gitlab_docs_access.log gitlab_secure;
    error_log /var/log/nginx/gitlab_docs_error.log warn;

    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://gitlab_docs_http;
    }
}

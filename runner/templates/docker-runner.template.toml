concurrent = 4
check_interval = 3
shutdown_timeout = 30

[[runners]]
  output_limit = 8192
  limit = 2
  request_concurrency = 2
  [runners.cache]
    Type = "s3"
    Shared = false
  [runners.docker]
    tls_verify = false
    image = "registry.example.co.kr/scm-runners/jdk:21"
    privileged = false
    disable_entrypoint_overwrite = false
    oom_kill_disable = false
    disable_cache = false
    volumes = ["/cache"]
    shm_size = 0
    pull_policy = ["if-not-present", "always"]
    allowed_images = [
      "registry.example.co.kr/scm-runners/*:*",
      "eclipse-temurin:*",
      "maven:*",
      "gradle:*",
      "node:*"
    ]
    allowed_services = []
    cap_drop = ["ALL"]
    security_opt = ["no-new-privileges:true"]

coverage:
  stage: test
  image: "${CI_RUNNER_JAVA_IMAGE:-bwc/maven:jdk21}"
  tags:
    - docker
    - amd64
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - bash ci/scripts/coverage-comment.sh
  coverage: '/Total coverage:\s+([0-9]+(?:\.[0-9]+)?)%/'
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - coverage-summary.txt
      - target/site/jacoco/
    reports:
      coverage_report:
        coverage_format: jacoco
        path: target/site/jacoco/jacoco.xml

coderay_sast:
  stage: secure
  tags:
    - secure-shell
    - coderay
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - bash ci/scripts/coderay-sast.sh
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - coderay-summary.txt
